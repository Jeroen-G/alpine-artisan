name: CI/CD

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron:  '0 0 1 * *'

jobs:
  build:
    name: CI/CD tag
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tag: [ web8.3, web8.4, web8.5 ]
    env:
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
      TAG: ${{ matrix.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Build the Docker image
        run: make build TAG=$TAG

      - name: Start an instance of the container
        run: make start TAG=$TAG

      - name: Waiting for the healthcheck
        run: sleep 15

      - name: Testing image health
        run: make test TAG=$TAG

      - name: Publishing new image
        if: ${{ success() && github.event_name != 'pull_request' }}
        run: echo "$DOCKER_TOKEN" | docker login -u="jeroeng" --password-stdin && docker push jeroeng/alpine-artisan:$TAG
